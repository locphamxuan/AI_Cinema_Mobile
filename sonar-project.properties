# SonarCloud / SonarQube analysis of the mobile app (run by .github/workflows/ci.yml).
# SonarCloud names an imported GitHub repo <organization>_<repo>; change both if yours differ.
sonar.organization=locphamxuan
sonar.projectKey=locphamxuan_AI_Cinema_Mobile
sonar.projectName=AI Cinema - Mobile

sonar.sources=app,src
sonar.tests=src/__tests__
sonar.test.inclusions=src/__tests__/**/*.ts,src/__tests__/**/*.tsx
sonar.exclusions=src/__tests__/**,assets/**
sonar.sourceEncoding=UTF-8

sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Type declarations carry no logic.
sonar.coverage.exclusions=src/__tests__/**,src/types/**,**/*.d.ts
