name: Mobile CI

on:
  push:
    branches: [main, dev, "feat/**", "fix/**", "ci/**", "refactor/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, tests, Android bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:cov -- --runInBand
      - run: npx expo export --platform android
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

  sonar:
    name: SonarCloud analysis
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Require the quality-gate token
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::error::SONAR_TOKEN is required; SonarCloud quality gate cannot be skipped."
          exit 1
      - uses: actions/checkout@v4
        if: env.SONAR_TOKEN != ''
        with:
          # Full history: Sonar needs it to tell new code from old code.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: env.SONAR_TOKEN != ''
        with:
          name: coverage
          path: coverage
      - name: Scan and wait for the quality gate
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
      # Expo SDK 52's build tooling (@expo/cli -> tar, xmldom, ...) carries advisories that only an SDK
      # upgrade clears; they never ship in the app. Reported, not blocking, until that upgrade lands.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
