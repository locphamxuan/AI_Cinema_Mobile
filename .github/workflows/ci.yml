name: Mobile CI

on:
  push:
    branches: [main, dev, "feat/**", "fix/**", "ci/**", "refactor/**", "chore/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, tests, Android bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:cov -- --runInBand
      - run: npx expo export --platform android

  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Blocking: no high/critical advisory, except the ones scripts/audit.mjs lists while no fix exists.
      - run: node scripts/audit.mjs --omit=dev
      - run: node scripts/audit.mjs
